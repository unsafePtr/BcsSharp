name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'        # v0.1.0, v0.2.0-preview.3, etc.
  workflow_dispatch:  # manual trigger for re-runs

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release          # secret scoping + optional approval gate
    permissions:
      id-token: write             # required for NuGet trusted publishing OIDC token
      contents: read              # explicit; setting permissions overrides defaults

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v7

      # Use the same SDK pin as CI. .NET 11 preview SDK is required for C# 15 union.
      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Validate version matches project
        run: |
          PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' BcsSharp.Core/BcsSharp.Core.csproj)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) doesn't match BcsSharp.Core.csproj <Version>$PROJECT_VERSION</Version>"
            exit 1
          fi

      - name: Pack
        run: dotnet pack BcsSharp.Core/BcsSharp.Core.csproj -c Release -o ./artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name (NOT email)

      - name: Push to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
